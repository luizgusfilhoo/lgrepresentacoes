name: Atualizar novidades das representadas

on:
  schedule:
    - cron: '37 9 * * *'
  workflow_dispatch:

concurrency:
  group: github-pages
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  update:
    outputs:
      revision: ${{ steps.revision.outputs.sha }}
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --ignore-scripts --no-fund
      - run: npm audit --audit-level=high
      - run: npm run build:hero
      - run: python -m pip install 'lxml==6.1.1'
      - run: python scripts/brand_updates.py
      - run: python scripts/render_updates.py
      - run: python scripts/render_showcase.py
      - run: python scripts/render_social_proof.py
      - run: node scripts/sync-dist.mjs
      - run: python -m unittest discover -s tests
      - run: node --test tests/*.test.cjs
      - name: Salvar conteúdo verificado
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add content/hero.html assets/ui dist/assets/ui data/brand-updates.json content/home.html content/representadas.html index.html representadas/index.html dist/index.html dist/representadas/index.html assets/novidades dist/assets/novidades
          if ! git diff --cached --quiet; then
            git commit -m 'Atualizar destaques das fontes oficiais'
            git push
          fi
      - name: Registrar revisão do artefato
        id: revision
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Configurar Analytics quando houver ID
        env:
          GA4_MEASUREMENT_ID: ${{ vars.GA4_MEASUREMENT_ID }}
        run: python scripts/inject_ga4.py
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    needs: update
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Verificar revisão antes de publicar
        id: current
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          BUILT_REVISION: ${{ needs.update.outputs.revision }}
        run: |
          latest=$(gh api "repos/$REPOSITORY/commits/main" --jq .sha)
          if [ "$latest" = "$BUILT_REVISION" ]; then
            echo "publish=true" >> "$GITHUB_OUTPUT"
          else
            echo "publish=false" >> "$GITHUB_OUTPUT"
            echo 'Revisão superada; artefato antigo não será publicado.'
          fi
      - name: Publicar no GitHub Pages
        if: steps.current.outputs.publish == 'true'
        id: deployment
        uses: actions/deploy-pages@v4
