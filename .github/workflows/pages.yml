name: Publicar site LG

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    outputs:
      revision: ${{ steps.revision.outputs.sha }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci --ignore-scripts --no-fund
      - run: npm audit --audit-level=high
      - run: python -m pip install 'lxml==6.1.1'
      - run: npm run build
      - run: npm test
      - name: Registrar revisão do artefato
        id: revision
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Configurar Analytics quando houver ID
        env:
          GA4_MEASUREMENT_ID: ${{ vars.GA4_MEASUREMENT_ID }}
        run: python scripts/inject_ga4.py
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Verificar revisão antes de publicar
        id: current
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          BUILT_REVISION: ${{ needs.build.outputs.revision }}
        run: |
          latest=$(gh api "repos/$REPOSITORY/commits/main" --jq .sha)
          if [ "$latest" = "$BUILT_REVISION" ]; then
            echo "publish=true" >> "$GITHUB_OUTPUT"
          else
            echo "publish=false" >> "$GITHUB_OUTPUT"
            echo 'Revisão superada; artefato antigo não será publicado.'
          fi
      - if: steps.current.outputs.publish == 'true'
        uses: actions/deploy-pages@v4
        id: deployment
